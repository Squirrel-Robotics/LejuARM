# Independent LT+Y / LT+X demonstrations; no rolling deletion.
dds:
  domain_id: 0
  discovery_timeout: 10.0
  use_regex: true
  topics:
  - /rt/imu_state
  - /rt/joint_state
  - /rt/joint_cmd
  - /rt/hand_cmd
  - /rt/hand_state
  - /rt/motor_state
  - /rt/motor_cmd
  - /rt/joy
  - /rt/hardware/state
  - /rt/hardware/stop
  - /rt/fall_stand_state
  - /rt/fall_stand_command
  - /rt/micphone_data
  - /monitor/.*
  - /.*/obs/.*
  - /.*/observations
  - /.*/q_target
  - /.*/motion_frame
  - /.*/policy_inference_frequency_hz
  - /.*/velocity_cmd_to_policy
  - /rl_controller/heft/.*
  - /rt/pico/heft_reference
  - /rt/pico/bone_poses
  - /rt/pico/joysticks
  - /rt/head_trajectory
output:
  prefix: vr
  append_date: false
  max_file_size: 0
  max_duration: 0
  split: false
  max_splits: 0
  min_space: 1024
  buffer_size: 1
  compression:
    enabled: true
    type: zstd
    level: 3
timing:
  use_sim_time: false
  start_immediately: true
logging:
  level: info
  console: true
  file_enabled: false
  file_path: recorder.log
